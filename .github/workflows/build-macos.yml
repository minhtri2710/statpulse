name: Build & Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Universal App (.app & .dmg)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Frontend & Tauri macOS App
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          npx tauri build --target universal-apple-darwin

      - name: Verify Bundle
        run: |
          scripts/verify-fan-actuation-bundle.sh src-tauri/target/universal-apple-darwin/release/bundle/macos/StatPulse.app

      - name: Package App (.app.tar.gz & .dmg)
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ${GITHUB_REF_TYPE:-} == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "Release tag and version differ" >&2
            exit 1
          fi
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          dmg="$bundle/dmg/StatPulse_${version}_universal.dmg"
          [[ -f "$dmg" && ! -L "$dmg" && -s "$dmg" ]] || { echo "Missing or invalid DMG: $dmg" >&2; exit 1; }
          archive="$bundle/macos/StatPulse-macOS-Universal.app.tar.gz"
          tar -czf "$archive" -C "$bundle/macos" StatPulse.app
          printf 'dmg=%s\narchive=%s\n' "$dmg" "$archive" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifacts (.app.tar.gz & .dmg)
        uses: actions/upload-artifact@v4
        with:
          name: StatPulse-macOS-Universal
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.dmg }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.dmg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
