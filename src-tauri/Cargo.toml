[package]
name = "statpulse"
default-run = "statpulse"
version = "1.5.0"
description = "StatPulse - High-performance Fan Control & Temperature Monitor for macOS"
authors = ["beowulf"]
edition = "2021"
autobins = false

[features]
daemon-bin = []

[[bin]]
name = "statpulse"
path = "src/main.rs"

[[bin]]
name = "fan-actuation-daemon"
path = "src/bin/fan-actuation-daemon.rs"
required-features = ["daemon-bin"]

[lib]
name = "statpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }
tempfile = "3"
sha2 = "0.10"
semver = "1"
plist = "1"
tokio = { version = "1", features = ["full", "test-util"] }
ts-rs = "12"
